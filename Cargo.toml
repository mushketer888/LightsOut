[package]
name = "lights-out"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
directories = "6.0.0"
notify = "8.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
tauri-winrt-notification = "0.8.1"
toml = "1.2.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Shutdown", "Win32_System_Threading", "Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Globalization"] }
winreg = "0.56.0"
wry = "0.57.1"

[build-dependencies]
resvg = "0.49.0"
winresource = "0.1.34"
