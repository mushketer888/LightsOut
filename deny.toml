[advisories]
version = 2
ignore = [
    # RUSTSEC-2024-0370: proc-macro-error unmaintained (not vulnerable).
    # Only reached via the Linux GTK stack (glib-macros 0.18 <- tao/tray-icon/wry);
    # unfixable until upstream moves to the gtk-rs 0.20 generation.
    "RUSTSEC-2024-0370",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
